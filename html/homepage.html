<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Assignment #2</title>

        <style>
            #map {
                height: 700px;
                width: 90%;
                margin-inline: auto;
            }
        </style>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js"></script>
        <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyKgngxb3e6XfjYl36DopmXYjNW0fyn_E&loading=async&callback=initMap&libraries=marker"></script>
        <script src="../js/art_exhibits.js"></script>
    </head>
    <body>
        <header>
            <div class="container-fluid">
                <div class="row">
                    <div class="col-8">
                        <h1 class="display-4">Art Exhibits of the Hamilton Region</h1>
                    </div>
                    <div class="col-4">
                        <h1 class="display-4">Landon Kushneryk, 2025</h1>
                    </div>
                </div>
            </div>
        </header>

        <div id="map"></div>
        <button type="button" class="btn btn-primary" onclick="filterMarkers('History')">History</button>
        <button type="button" class="btn btn-danger" onclick="filterMarkers('Cafe')">Cafe</button>
        <button type="button" class="btn btn-warning" onclick="filterMarkers('Gallery')">Gallery</button>
        <button type="button" class="btn btn-success" onclick="filterMarkers('Museum')">Museum</button>
        <button type="button" class="btn btn-dark" onclick="filterMarkers('Restore')">Restore</button>

        <div class="container-fluid">
            <div class="row">
                <button id="geolocate">Geolocate</button><br>
            </div>
        </div>

        <!-- Temporary -->
        <br><br><br>

        <form>
            <div class="row">
                <div class="col-3">
                    <label for="name">Establishment</label>
                    <input type="text" class="form-control" id="name">
                </div>
                <div class="col-3">
                    <label for="location">Location</label>
                    <input type="text" class="form-control" id="location">
                </div>
            </div>

            <!-- Temporary -->
            <br>

            <div class="row">
                <div class="col-3">
                    <label for="site">Website</label>
                    <input type="text" class="form-control" id="site">
                </div>
                <div class="col-3">
                    <label for="category">Category</label>
                    <select id="category" class="form-control" name="category">
                        <option selected>Select a category</option>
                        <option value="Museum">Museum</option>
                        <option value="Gallery">Gallery</option>
                        <option value="Cafe">Cafe</option>
                    </select>
                </div>
            </div>
        </form>

        <!-- Temporary -->
        <br><br>

        <button type="button" class="btn btn-success" onclick="createMarker(document.getElementById('location').value, document.getElementById('name').value, document.getElementById('category').value)">Add Custom Marker</button>

        <!-- Temporary -->
        <br><br>

        <p id="demo"></p>

        <!-- Temporary -->
        <br><br><br><br><br><br><br><br><br>

        <script>
            let map;
            var markers = [];

            $(document).ready(function() {
                function showPosition(position) {
                    let location = {lat: position.coords.latitude, lng: position.coords.longitude};

                    position_marker = new google.maps.marker.AdvancedMarkerElement({
                        map: map,
                        position: location,
                        title: "Your Location"
                    })
                }

                function getLocation() {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(showPosition)
                    }
                }

                document.getElementById("geolocate").onclick = getLocation;
            })

            /**
             * Initializes the map and other useful objects.
             */
            function initMap() {
                map = new google.maps.Map(document.getElementById("map"),
                {
                    center: { lat: 43.2557, lng: -79.8711 },
                    zoom: 12,
                    mapId: "my_id"
                });

                // Initialize the geocoder for adding custom markers
                geocoder = new google.maps.Geocoder();

                // Add the markers and handle the InfoWindow
                initMarkers();

                // Only one InfoWindow is needed; it is moved around as neccessary.
                infoWindow = new google.maps.InfoWindow();
            }

            /**
             * Handles the initial creation of markers according to the contents of art_exhibits.ks
             */
            function initMarkers() {
                for (i = 0; i < art_exhibits.length; i++) {
                    let address = (art_exhibits[i].ADDRESS).concat(", ", art_exhibits[i].COMMUNITY, ", ", "ON");
                    createMarker(address, art_exhibits[i].NAME, art_exhibits[i].TYPE);
                }
            }

            /**
             * Creates and places a marker on the map using the provided information
             * location: the address of the marker
             * name: the title of the establishment
             * category: the theme of the establishment
             */ 
            function createMarker(location, name, category) {
                geocoder.geocode({
                    'address': location
                },  function(results, status) {
                        if (status == 'OK') {
                            // Use the category of the establishment to select a paddle colour.
                            switch(category) {
                                case "Gallery":
                                    new_icon = "http://maps.google.com/mapfiles/kml/paddle/ylw-blank.png";
                                    break;
                                case "History":
                                    new_icon = "http://maps.google.com/mapfiles/kml/paddle/blu-blank.png";
                                    break;
                                case "Cafe":
                                    new_icon = "http://maps.google.com/mapfiles/kml/paddle/pink-blank.png";
                                    break;
                                case "Museum":
                                    new_icon = "http://maps.google.com/mapfiles/kml/paddle/grn-blank.png";
                                    break;
                            }

                            const icon_content = document.createElement("img");
                            icon_content.src = new_icon;

                            // Create the marker using the parameter data.
                            var marker = new google.maps.marker.AdvancedMarkerElement({
                                map: map, 
                                position: results[0].geometry.location,
                                title: name,
                                content: icon_content
                            })
                            marker['type'] = category;

                            // Function for displaying an InfoWindow upon clicking.
                            let marker_clicked = function() {
                                infoWindow.close();
                                infoWindow.setContent(
                                    "<h5>" + name + "</h5>" +
                                    "<h6>" + location + "</h6>" /*+
                                    "<a href=" + aaa + ">Visit our Website</a>"*/
                                );
                                infoWindow.open(map, this);
                            }

                            // Add the marker to the array and hookup the click listener.
                            markers.push(marker);
                            marker.addListener('click', marker_clicked);
                        }
                        else {
                            alert('Geocode was unsuccessful: ' + status)
                        }
                })  
            }

            /**
             * Hides markers that are not of a certain type.
             * option - the category to filter markers by
             */ 
            function filterMarkers(option) {
                for (let i = 0; i < markers.length; i++) {
                    // Restore the marker to default prior to filtering.
                    markers[i].setMap(map);

                    // Use to the option to set the sort criteria.
                    switch(option) {
                        case "History":
                            if (markers[i].type != "History") {
                                markers[i].setMap(null);
                            }
                            break;

                        case "Museum":
                            if (markers[i].type != "Museum") {
                                markers[i].setMap(null);
                            }
                            break;

                        case "Gallery":
                            if (markers[i].type != "Gallery") {
                                markers[i].setMap(null);
                            }
                            break;

                        case "Cafe":
                            if (markers[i].type != "Cafe") {
                                markers[i].setMap(null);
                            }
                            break;

                        case "Restore":
                            break;
                    }
                }
            }
        </script>
    </body>
</html>
