<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Assignment #2</title>

        <style>
            #map {
                height: 700px;
                width: 90%;
                margin-inline: auto;
            }
        </style>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js"></script>
        <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyKgngxb3e6XfjYl36DopmXYjNW0fyn_E&loading=async&callback=initMap&libraries=marker"></script>
        <script src="../js/art_exhibits.js"></script>
    </head>
    <body>
        <header>
            <div class="container-fluid">
                <div class="row">
                    <div class="col-8">
                        <h1 class="display-4">Art Exhibits of the Hamilton Region</h1>
                    </div>
                    <div class="col-4">
                        <h1 class="display-4">Landon Kushneryk, 2025</h1>
                    </div>
                </div>
            </div>
        </header>

        <div id="map"></div>
        <button type="button" class="btn btn-danger" onclick="filterMarkers('hamilton')">Hamilton</button>
        <button type="button" class="btn btn-primary" onclick="filterMarkers('museums')">Museums</button>
        <button type="button" class="btn btn-success" onclick="filterMarkers('gallery')">Galleries</button>

        <div class="container-fluid">
            <div class="row">
                <button id="geolocate">Geolocate</button><br>
            </div>
        </div>

        <!-- Temporary -->
        <br><br><br>

        <form>
            <div class="row">
                <div class="col-3">
                    <label for="name">Establishment</label>
                    <input type="text" class="form-control" id="name">
                </div>
                <div class="col-3">
                    <label for="location">Location</label>
                    <input type="text" class="form-control" id="location">
                </div>
            </div>

            <!-- Temporary -->
            <br>

            <div class="row">
                <div class="col-3">
                    <label for="site">Website</label>
                    <input type="text" class="form-control" id="site">
                </div>
                <div class="col-3">
                    <label for="site">Category</label>
                    <select id="site" class="form-control" name="site">
                        <option selected>Select a category</option>
                        <option value="hamilton">Hamilton</option>
                        <option value="museum">Museum</option>
                        <option value="gallery">Gallerie</option>
                    </select>
                </div>
            </div>
        </form>

        <!-- Temporary -->
        <br><br>

        <button type="button" class="btn btn-success" onclick="addMarker()">Add Custom Marker</button>

        <!-- Temporary -->
        <br><br>

        <p id="demo"></p>

        <!-- Temporary -->
        <br><br><br><br><br><br><br><br><br>

        <script>
            let map;
            var markers = [];

            $(document).ready(function() {
                function showPosition(position) {
                    let location = {lat: position.coords.latitude, lng: position.coords.longitude};

                    position_marker = new google.maps.marker.AdvancedMarkerElement({
                        map: map,
                        position: location,
                        title: "Your Location"
                    })
                }

                function getLocation() {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(showPosition)
                    }
                }

                document.getElementById("geolocate").onclick = getLocation;
            })

            function initMap() {
                // Initialize the map.
                map = new google.maps.Map(document.getElementById("map"),
                {
                    center: { lat: 43.2557, lng: -79.8711 },
                    zoom: 12,
                    mapId: "my_id"
                });

                // Add the markers and handle the InfoWindow
                loadMarkers();

                // Initialize the geocoder for adding custom markers
                geocoder = new google.maps.Geocoder();

                // Only one InfoWindow is needed; it is moved around as neccessary.
                infoWindow = new google.maps.InfoWindow();
            }

            function loadMarkers() {
                for (i = 0; i < art_exhibits.length; i++) {
                    // Use the community of an art exhibit to determine the icon to use.
                    switch (art_exhibits[i].COMMUNITY) {
                        case "Ancaster":
                            new_icon = "http://maps.google.com/mapfiles/kml/paddle/blu-blank.png";
                            break;

                        case "Hamilton":
                            new_icon = "http://maps.google.com/mapfiles/kml/paddle/pink-blank.png";
                            break;

                        case "Glanbrook":
                            new_icon = "http://maps.google.com/mapfiles/kml/paddle/ylw-blank.png";
                            break;

                        case "Stoney Creek":
                            new_icon = "http://maps.google.com/mapfiles/kml/paddle/grn-blank.png";
                            break;
                    }

                    const icon_content = document.createElement("img");
                    icon_content.src = new_icon;

                    // Initialize a marker with the position and title noted in the JS file.
                    new_marker = new google.maps.marker.AdvancedMarkerElement({
                        map: map,
                        position: {
                            lat: art_exhibits[i].LATITUDE,
                            lng: art_exhibits[i].LONGITUDE
                        },
                        title: art_exhibits[i].NAME,
                        content: icon_content
                    });

                    // Push the marker to the array for future removal.
                    markers.push(new_marker);

                    // Function for displaying an InfoWindow upon clicking.
                    let marker_clicked = function() {
                        infoWindow.close();
                        infoWindow.setContent(
                            "<h5>" + this.NAME + "</h5>" +
                            "<h6>" + address + ", " + this.COMMUNITY + ", ON" + "</h6>" +
                            "<a href=" + website + ">Visit our Website</a>"
                        );
                        infoWindow.open(map, this);
                    }

                    let address = art_exhibits[i].ADDRESS;
                    let website = art_exhibits[i].WEBSITE;
                    new_marker.NAME = art_exhibits[i].NAME;
                    new_marker.COMMUNITY = art_exhibits[i].COMMUNITY;
                    new_marker.addListener('click', marker_clicked);
                }
            }

            function filterMarkers(option) {
                // Reload the markers as to restore previously removed markers.
                loadMarkers();

                // For each marker, test it against the condition of the button pressed.
                for (x = 0; x < markers.length; x++) {
                    switch(option) {
                        case "hamilton":
                            if (markers[x].COMMUNITY != "Hamilton") {
                                markers[x].position = null;
                            }
                            break;

                        case "museums":
                            if (markers[x].NAME.search("Museum") == -1) {
                                markers[x].position = null;
                            } 
                            break;

                        case "gallery":
                            if (markers[x].NAME.search("Gallery") == -1) {
                                markers[x].position = null;
                            }
                            break;
                    }
                }
            }

            function addMarker() {
                let address = document.getElementById("location").value;

                geocoder.geocode({
                    'address': address
                },  function(results, status) {
                        if (status == "OK") {
                            const icon_content = document.createElement("img");
                            icon_content.src = "http://maps.google.com/mapfiles/kml/paddle/purple-blank.png";;

                            var marker = new google.maps.marker.AdvancedMarkerElement({
                                map: map, 
                                position: results[0].geometry.location,
                                content: icon_content
                            })

                            // Function for displaying an InfoWindow upon clicking.
                            let marker_clicked = function() {
                                infoWindow.close();
                                infoWindow.setContent(
                                    "WOAH"
                                );
                                infoWindow.open(map, this);
                            }

                            marker.addListener('click', marker_clicked);

                            //markers.push(marker);
                        }
                        else {
                            alert('Geocode was unsuccessful: ' + status)
                        }
                    }
                )
            }

            function getDirections() {

            }

        </script>
    </body>
</html>
