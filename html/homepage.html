<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Assignment #2 - Map Application</title>

        <style>
            #map {
                height: 580px;
                width: 100%;
                margin-inline: auto;
                margin-bottom: 5px;
            }

            .btn {
                margin-top: 10px;
            }

            .pad {
                margin-bottom: 15px;
            }
        </style>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js"></script>
        <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyKgngxb3e6XfjYl36DopmXYjNW0fyn_E&loading=async&callback=initMap&libraries=marker"></script>
        <script src="../js/art_exhibits.js"></script>
    </head>
    <body>
        <header>
            <div class="container-fluid">
                <div class="row">
                    <h1 class="display-4">Art Exhibits of the Hamilton Region</h1>
                </div>
            </div>
        </header>

        <div id="map"></div>

        <div class="container-fluid">
            <div class="row">
                <div class="col-md pad">
                    <div class="row mx-auto">
                        <h2>Marker Filters</h2>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <button type="button" class="btn btn-primary btn-block" onclick="filterMarkers('History')">Historic Sites</button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-danger btn-block" onclick="filterMarkers('Cafe')">Cafés</button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <button type="button" class="btn btn-warning btn-block" onclick="filterMarkers('Gallery')">Galleries</button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-success btn-block" onclick="filterMarkers('Museum')">Museums</button>
                        </div>
                    </div>
                    <div class="row mx-auto">
                        <button type="button" class="btn btn-dark btn-block" onclick="filterMarkers('Restore')">Restore to Default</button>
                    </div>
                    <div class="row mx-auto">
                        <button type="button" class="btn btn-info btn-block" id="geolocate">Geolocate</button>
                    </div>
                </div>

                <div class="col-md pad">
                    <h2>Add Custom Marker</h2>
                    <form>
                        <div class="row">
                            <div class="col-6">
                                <label for="name">Establishment</label>
                                <input type="text" class="form-control" id="name" placeholder="Lukas' Arts">
                            </div>
                            <div class="col-6">
                                <label for="location">Location</label>
                                <input type="text" class="form-control" id="location" placeholder="Address, City, Province">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <label for="site">Website</label>
                                <input type="text" class="form-control" id="site" placeholder="https://lukasarts.ca">
                            </div>
                            <div class="col-6">
                                <label for="category">Category</label>
                                <select id="category" class="form-control" name="category">
                                    <option value="History">Historic Site</option>
                                    <option value="Cafe">Café</option>
                                    <option value="Gallery">Gallery</option>
                                    <option value="Museum">Museum</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mx-auto">
                            <button type="button" class="btn btn-dark btn-block" onclick="createMarker(document.getElementById('location').value, document.getElementById('name').value, document.getElementById('category').value, document.getElementById('site').value)">Add Custom Marker</button>
                        </div>
                    </form>
                </div>

                <div class="col-md pad">
                    <h2>Directions</h2>
                    <form>
                        <div class="row mx-auto">
                            <label for="origin">Origin</label>
                            <select class="form-control" id="origin">
                                <!-- Filled with addresses via JQuery -->
                            </select>
                        </div>
                        <div class="row mx-auto">
                            <label for="destination">Destination</label>
                            <select class="form-control" id="destination">
                                <!-- Filled with addresses via JQuery -->
                            </select>
                        </div>
                        <div class="row mx-auto">
                            <button type="button" class="btn btn-dark btn-block" onclick="getDirections(document.getElementById('origin').value, document.getElementById('destination').value)">Directions</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="container">
            <footer class="py-4 mx-auto">
              <h1 class="display-4">Landon Kushneryk, 2025 | COMP-10244</h1>
            </footer>
        </div>

        <script>
            let map;            // The google map.
            var markers = [];   // An array of initialized markers.
            var counter = 0;    // Used in tandem with markers[] for directions.

            $(document).ready(function() {
                function showPosition(position) {
                    let location = {lat: position.coords.latitude, lng: position.coords.longitude};

                    position_marker = new google.maps.marker.AdvancedMarkerElement({
                        map: map,
                        position: location,
                        title: "Your Location"
                    })
                }

                function getLocation() {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(showPosition)
                    }
                }

                document.getElementById("geolocate").onclick = getLocation;
            })

            /**
             * Initializes the map and other useful objects.
             */
            function initMap() {
                map = new google.maps.Map(document.getElementById("map"),
                {
                    center: { lat: 43.2557, lng: -79.8711 },
                    zoom: 12,
                    mapId: "my_id"
                });

                // Initialize the geocoder for adding custom markers
                geocoder = new google.maps.Geocoder();

                // Add the markers and handle the InfoWindow
                initMarkers();

                // Only one InfoWindow is needed; it is moved around as neccessary.
                infoWindow = new google.maps.InfoWindow();

                // Used for calculating directions between markers.
                directionsService = new google.maps.DirectionsService();
                directionsRenderer = new google.maps.DirectionsRenderer();
                directionsRenderer.setMap(map);
            }

            /**
             * Handles the initial creation of markers according to the contents of art_exhibits.ks
             */
            function initMarkers() {
                for (i = 0; i < art_exhibits.length; i++) {
                    let address = (art_exhibits[i].ADDRESS).concat(", ", art_exhibits[i].COMMUNITY, ", ", "ON");
                    createMarker(address, art_exhibits[i].NAME, art_exhibits[i].TYPE, art_exhibits[i].WEBSITE);
                }
            }

            /**
             * Creates and places a marker on the map using the provided information
             * location: the address of the marker
             * name: the title of the establishment
             * category: the theme of the establishment
             * website: the website of the establishment
             */ 
            function createMarker(location, name, category, website) {
                geocoder.geocode({
                    'address': location
                },  function(results, status) {
                        if (status == 'OK') {
                            // Use the category of the establishment to select a paddle colour.
                            switch(category) {
                                case "Gallery":
                                    new_icon = "http://maps.google.com/mapfiles/kml/paddle/ylw-blank.png";
                                    break;
                                case "History":
                                    new_icon = "http://maps.google.com/mapfiles/kml/paddle/blu-blank.png";
                                    break;
                                case "Cafe":
                                    new_icon = "http://maps.google.com/mapfiles/kml/paddle/pink-blank.png";
                                    break;
                                case "Museum":
                                    new_icon = "http://maps.google.com/mapfiles/kml/paddle/grn-blank.png";
                                    break;
                                default:
                                    new_icon = "http://maps.google.com/mapfiles/kml/paddle/purple-blank.png";
                                    break;
                            }

                            const icon_content = document.createElement("img");
                            icon_content.src = new_icon;

                            // If a name was not provided, set the name to the marker's position within the array.
                            if (name === "") {
                                name = counter.toString();
                            }

                            // Create the marker using the parameter data.
                            var marker = new google.maps.marker.AdvancedMarkerElement({
                                map: map, 
                                position: results[0].geometry.location,
                                title: name,
                                content: icon_content
                            })
                            marker['type'] = category;
                            marker['address'] = location;

                            // Function for displaying an InfoWindow upon clicking.
                            let marker_clicked = function() {
                                infoWindow.close();
                                infoWindow.setContent(
                                    "<h5>" + name + "</h5>" +
                                    "<h6>" + location + "</h6>" +
                                    "<a href=" + website + ">Visit our Website</a>"
                                );
                                infoWindow.open(map, this);
                            }

                            // Add the marker to the array and hookup the click listener.
                            markers.push(marker);
                            marker.addListener('click', marker_clicked);

                            // Add the marker to the list of locations eligible for directions.
                            $('#origin').append("<option value=" + counter + ">" + name + "</option>");
                            $('#destination').append("<option value=" + counter + ">" + name + "</option>");

                            // Increment counter for next marker.
                            counter++;
                        }
                        else {
                            alert('Geocode was unsuccessful: ' + status)
                        }
                })  
            }

            /**
             * Hides markers that are not of a certain type.
             * option - the category to filter markers by
             */ 
            function filterMarkers(option) {
                for (let i = 0; i < markers.length; i++) {
                    // Restore the marker to default prior to filtering.
                    markers[i].setMap(map);

                    // Use to the option to set the sort criteria.
                    switch(option) {
                        case "History":
                            if (markers[i].type != "History") {
                                markers[i].setMap(null);
                            }
                            break;

                        case "Museum":
                            if (markers[i].type != "Museum") {
                                markers[i].setMap(null);
                            }
                            break;

                        case "Gallery":
                            if (markers[i].type != "Gallery") {
                                markers[i].setMap(null);
                            }
                            break;

                        case "Cafe":
                            if (markers[i].type != "Cafe") {
                                markers[i].setMap(null);
                            }
                            break;

                        case "Restore":
                            break;
                    }
                }
            }

            /**
             * Displays the path from the origin to the destination.
             * org - the origin location
             * dest - the destination location
             */
            function getDirections(org, dest) {
                let request = {
                    origin: markers[org].address,
                    destination: markers[dest].address,
                    travelMode: 'DRIVING'
                }

                directionsService.route(request, function(result, status) {
                    if (status == "OK") {
                        directionsRenderer.setDirections(result)
                    }
                })
            }
        </script>
    </body>
</html>
